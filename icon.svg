<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e3ff"/>
      <stop offset="0.55" stop-color="#f8ecff"/>
      <stop offset="1" stop-color="#ffe7f2"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffd8e8"/>
      <stop offset="1" stop-color="#ffa8cb"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c9"/>
      <stop offset="1" stop-color="#ffd873"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d8ff"/>
      <stop offset="1" stop-color="#d3bcff"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0ee"/>
      <stop offset="1" stop-color="#ffc3dc"/>
    </linearGradient>
    <linearGradient id="tileC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c6"/>
      <stop offset="1" stop-color="#ffe28f"/>
    </linearGradient>
  </defs>

  <!-- rounded app background -->
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <circle cx="74" cy="72" r="56" fill="#e4d0ff" opacity="0.5"/>
  <circle cx="196" cy="66" r="30" fill="#ffd9e9" opacity="0.55"/>

  <!-- little sparkles -->
  <path d="M62 72 C63.6 77.4 64.6 78.4 70 80 C64.6 81.6 63.6 82.6 62 88 C60.4 82.6 59.4 81.6 54 80 C59.4 78.4 60.4 77.4 62 72 Z" fill="#ffd166"/>
  <path d="M196 84 C197.1 87.9 197.9 88.7 201.8 89.8 C197.9 90.9 197.1 91.7 196 95.6 C194.9 91.7 194.1 90.9 190.2 89.8 C194.1 88.7 194.9 87.9 196 84 Z" fill="#ffffff" opacity="0.9"/>

  <!-- stem and leaves -->
  <path d="M128 146 C128 155 128 161 128 170" fill="none" stroke="#bda6ea" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="115" cy="157" rx="10" ry="5.4" fill="#cdb6f2" transform="rotate(-28 115 157)"/>
  <ellipse cx="141" cy="162" rx="9" ry="5" fill="#cdb6f2" transform="rotate(24 141 162)"/>

  <!-- smiling flower -->
  <g transform="translate(128 100)">
    <g fill="url(#petal)" stroke="#ffffff" stroke-width="2.4" stroke-opacity="0.75">
      <ellipse cx="0" cy="-31" rx="19" ry="23"/>
      <ellipse cx="0" cy="-31" rx="19" ry="23" transform="rotate(60)"/>
      <ellipse cx="0" cy="-31" rx="19" ry="23" transform="rotate(120)"/>
      <ellipse cx="0" cy="-31" rx="19" ry="23" transform="rotate(180)"/>
      <ellipse cx="0" cy="-31" rx="19" ry="23" transform="rotate(240)"/>
      <ellipse cx="0" cy="-31" rx="19" ry="23" transform="rotate(300)"/>
    </g>
    <circle cx="0" cy="0" r="24" fill="url(#face)"/>
    <ellipse cx="-15.5" cy="4" rx="4.4" ry="3.2" fill="#ff8fb8" opacity="0.8"/>
    <ellipse cx="15.5" cy="4" rx="4.4" ry="3.2" fill="#ff8fb8" opacity="0.8"/>
    <ellipse cx="-9" cy="-3" rx="3" ry="3.8" fill="#4a3a67"/>
    <ellipse cx="9" cy="-3" rx="3" ry="3.8" fill="#4a3a67"/>
    <path d="M-7.5 6 Q0 13.5 7.5 6" fill="none" stroke="#4a3a67" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- linked rounded word tiles -->
  <ellipse cx="128" cy="214" rx="74" ry="8" fill="#7d63a8" opacity="0.12"/>
  <g>
    <rect x="67" y="172" width="36" height="36" rx="11" fill="url(#tileA)"/>
    <rect x="72" y="177" width="26" height="26" rx="8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-opacity="0.6"/>
    <rect x="110" y="172" width="36" height="36" rx="11" fill="url(#tileB)"/>
    <rect x="115" y="177" width="26" height="26" rx="8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-opacity="0.6"/>
    <rect x="153" y="172" width="36" height="36" rx="11" fill="url(#tileC)"/>
    <rect x="158" y="177" width="26" height="26" rx="8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-opacity="0.6"/>
  </g>
  <rect x="101" y="186" width="11" height="8" rx="4" fill="#7d63a8"/>
  <rect x="144" y="186" width="11" height="8" rx="4" fill="#7d63a8"/>
</svg>
