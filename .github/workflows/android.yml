name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Optional published WSS server URL; leave empty for offline play"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GODOT_VERSION: "4.5.2"
      ANDROID_BUILD_TOOLS: "35.0.0"
      WORD_GARDEN_SERVER_URL: ${{ inputs.server_url || vars.WORD_GARDEN_SERVER_URL }}
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/word-garden-release.p12
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: wordgarden
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check stable signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ.get("KEYSTORE_B64", "")
          if not key or not os.environ.get("GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD"):
              raise SystemExit("Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD first. Never generate a new key for every build.")
          path = Path(os.environ["GODOT_ANDROID_KEYSTORE_RELEASE_PATH"])
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PY
          keytool -list -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            -storepass:env GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD -alias wordgarden >/dev/null

      - name: Check Android SDK tools on runner
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/build-tools/$ANDROID_BUILD_TOOLS/apksigner" ]; then
            sdkmanager --sdk_root="$SDK" "build-tools;$ANDROID_BUILD_TOOLS" "platform-tools"
          fi
          test -x "$SDK/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          echo "WORD_GARDEN_ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Install verified Godot and export templates on GitHub runner
        run: python3 tools/android_ci.py setup

      - name: Configure signed universal ARM APK
        run: python3 tools/android_ci.py configure

      - name: Validate game before export
        run: |
          godot --headless --path . --import 2>&1 | tee /tmp/garden-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' /tmp/garden-import.log; then exit 1; fi
          for suite in core content compounds ui; do
            godot --headless --path . --script "tests/test_${suite}.gd" 2>&1 | tee "/tmp/garden-${suite}.log"
            grep -q 'RESULT: PASS' "/tmp/garden-${suite}.log"
            if grep -E 'SCRIPT ERROR|^ERROR:|ObjectDB instances leaked' "/tmp/garden-${suite}.log"; then exit 1; fi
          done
          npm ci --omit=dev --prefix backend
          npm test --prefix backend

      - name: Build signed APK
        run: |
          mkdir -p builds
          godot --headless --path . --export-release Android builds/Kelime-Bahcesi-Android.apk 2>&1 | tee /tmp/garden-export.log
          if grep -E 'SCRIPT ERROR|^ERROR:|Export failed' /tmp/garden-export.log; then exit 1; fi
          python3 tools/android_ci.py verify

      - name: Publish downloadable APK (not an artifact ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" builds/Kelime-Bahcesi-Android.apk builds/Kelime-Bahcesi-Android.apk.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Android deneme ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file builds/release-notes.md
          LINK="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "## Android APK hazır"
            echo "[APK dosyasını indir]($LINK) — Releases bölümündeki Kelime-Bahcesi-Android.apk"
            echo "APK dosyasını WhatsApp/Drive ile paylaşabilirsiniz. Gizli repo bağlantısı arkadaşlarınıza erişim sağlamaz."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner-only signing file
        if: always()
        run: rm -f -- "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
