name: Web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install verified Godot on GitHub runner
        run: python3 tools/android_ci.py setup

      - name: Validate game before export
        run: |
          godot --headless --path . --import 2>&1 | tee /tmp/garden-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' /tmp/garden-import.log; then exit 1; fi
          for suite in core content ui; do
            godot --headless --path . --script "tests/test_${suite}.gd" 2>&1 | tee "/tmp/garden-${suite}.log"
            grep -q 'RESULT: PASS' "/tmp/garden-${suite}.log"
            if grep -E 'SCRIPT ERROR|^ERROR:|ObjectDB instances leaked' "/tmp/garden-${suite}.log"; then exit 1; fi
          done

      - name: Build web export
        run: |
          mkdir -p builds/web
          godot --headless --path . --export-release Web builds/web/index.html 2>&1 | tee /tmp/garden-web-export.log
          if grep -E 'SCRIPT ERROR|^ERROR:|Export failed' /tmp/garden-web-export.log; then exit 1; fi
          ls -la builds/web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4